name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, source pin, and iOS build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install mobile dependencies
        run: npm ci

      - name: Prepare exact ZenNotes source
        run: npm run source:prepare

      - name: Reject high-severity production advisories
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix .zennotes-source audit --omit=dev --audit-level=high

      - name: Test and typecheck bridges
        run: |
          npm test
          npm run typecheck
          npm run upstream

      - name: Build and sync iOS project
        run: npm run sync

      - name: Compile app and UI-test targets
        run: >-
          xcodebuild build-for-testing
          -workspace ios/App/App.xcworkspace
          -scheme AppCloudUITests
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
